name: terraform

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Run opt-in Terraform plan generation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate

      - name: Terraform providers
        run: terraform providers

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.56.0

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        with:
          soft_fail: false

  terraform-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.run_plan && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    needs: terraform-checks
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Validate plan prerequisites
        run: |
          test -n "${AZURE_CLIENT_ID}" || (echo "Missing repository variable: AZURE_CLIENT_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)
          test -n "${AZURE_TENANT_ID}" || (echo "Missing repository variable: AZURE_TENANT_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)
          test -n "${AZURE_SUBSCRIPTION_ID}" || (echo "Missing repository variable: AZURE_SUBSCRIPTION_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform plan (no apply)
        run: terraform plan -lock=false -input=false -var-file=examples/safe.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: tfplan
