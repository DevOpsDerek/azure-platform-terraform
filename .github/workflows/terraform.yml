name: terraform

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Run opt-in Terraform plan generation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  automation-validation:
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21
      workflows-directory: .github/workflows

  terraform-validation:
    uses: DevOpsDerek/workflows/.github/workflows/lint-terraform.yml@30f86d7d8536364b0a31de4bc66214b39e8785bb
    with:
      terraform-version: 1.9.8
      working-directory: .

  terraform-checks:
    needs: terraform-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.9.8

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform providers
        run: terraform providers

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6
        with:
          tflint_version: v0.56.0

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Validate approved deployment exercise safeguards
        run: bash ./tests/validate_azure_deployment_exercise.sh

      - name: Validate approved deployment exercise Terraform
        run: |
          terraform -chdir=exercises/azure-deployment init -backend=false -input=false -lockfile=readonly
          terraform -chdir=exercises/azure-deployment validate

      - name: tfsec
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6
        with:
          soft_fail: false

  terraform-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.run_plan && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected
    needs: terraform-checks
    runs-on: ubuntu-latest
    environment: terraform-plan
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.9.8

      - name: Validate plan prerequisites
        run: |
          test -n "${AZURE_CLIENT_ID}" || (echo "Missing repository variable: AZURE_CLIENT_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)
          test -n "${AZURE_TENANT_ID}" || (echo "Missing repository variable: AZURE_TENANT_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)
          test -n "${AZURE_SUBSCRIPTION_ID}" || (echo "Missing repository variable: AZURE_SUBSCRIPTION_ID (repository variables are not exposed to fork-triggered runs)." && exit 1)

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform plan (no apply)
        run: terraform plan -lock=false -input=false -var-file=examples/safe.tfvars -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terraform-plan
          path: tfplan
